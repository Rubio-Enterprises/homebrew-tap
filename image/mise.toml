# Repository toolchain pins only, installed by Dockerfile
# Check tools are supplied by base at /opt/standards
[tools]
node = "24.22.2"
# The source-transports Check runs a Ruby script; the Dev Container has no Ruby.
ruby = "3.4.12"
"aqua:jdx/mise" = { version = "2026.11.1", os = ["macos"] }
"aqua:realm/SwiftLint" = { version = "0.65.1", os = ["macos"] }
"aqua:cpisciotta/xcbeautify" = { version = "3.2.1", os = ["macos"] }
"aqua:evilmartians/lefthook" = { version = "2.1.12", os = ["macos", "linux"] }
"aqua:mikefarah/yq" = { version = "4.53.6", os = ["macos", "linux"] }
