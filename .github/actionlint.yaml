# Tap-level actionlint config, honored by `brew style` (verified 2026-07-21:
# actionlint resolves this file from the project root of the workflows it
# lints, overriding Homebrew/brew's own .github/actionlint.yaml whose
# config-variables whitelist knows only Homebrew's variables).
#
# Without this, org-templated workflows referencing private org variables
# fail brew style with "undefined configuration variable". RUNNERS is used
# by this tap's own macOS workflows; RUNNER_GLUE is still referenced literally
# by the Copier-rendered release-please.yml until the standards update lands.
# Keep only variables actually referenced by workflows in this checkout.
config-variables:
  - RUNNERS
  - RUNNER_GLUE
