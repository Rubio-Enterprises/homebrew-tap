name: Bump casks

on:
  schedule:
    - cron: "0 9 1 * *" # 1st of every month at 9 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    uses: Rubio-Enterprises/.github/.github/workflows/project-route.yml@main
    with:
      route: macos

  bump:
    permissions:
      contents: write
      pull-requests: write
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Rubio-Enterprises/.github/actions/setup-just@main
      - name: Audit and bump casks
        run: just bump-casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: bump cask versions"
          branch: auto-bump-casks
          title: "Bump cask versions"
          body: |
            Automated monthly version bump detected by `brew livecheck`.

            Verify the updated versions and SHA256 hashes before merging.
          delete-branch: true
