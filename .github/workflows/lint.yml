name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ${{ fromJSON(vars.RUNNER_MACOS || '["macos-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # main
        with:
          token: ${{ github.token }}

      - name: Audit formulas
        run: brew audit --formula --tap rubio-enterprises/tap

      - name: Audit casks
        run: brew audit --cask --tap rubio-enterprises/tap

      - name: Style check
        # Homebrew's bundled shfmt and the fleet's upstream shfmt disagree on
        # shell control-flow layout. The fleet formatter governs the
        # template-rendered scripts/** tree, so scope Homebrew style to the
        # Formula/ and Casks/ trees it owns, matching the *.rb-only fleet hook.
        run: brew style "$(brew --repo rubio-enterprises/tap)"/{Formula,Casks}

      - name: Livecheck (casks)
        run: brew livecheck --cask --tap rubio-enterprises/tap
