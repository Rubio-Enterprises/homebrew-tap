# Repo-owned mise config, merged with the template-owned .mise.toml.

# `test` runs a Ruby script. CI uses the runner's Ruby; the Dev Container has
# none, so mise provides it.
[tools]
ruby = "3.4.10"

[tasks.test]
description = "Reject SSH source transports in all formulas and casks (offline)"
run = "ruby scripts/check-source-transports.rb"
